name: CI

on:
  push:
    branches: [main]
    # Release tags. `check` has no branch filter, so it runs on these too, and
    # `publish-sdk` needs it: a tag whose checks fail never reaches npm.
    tags: ['sdk-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The major only; setup-node resolves the newest 22.x, which is above the
  # floor in package.json `engines`. The pnpm version comes from
  # `packageManager` in package.json (setting it here as well makes
  # pnpm/action-setup fail).
  NODE_VERSION: '22'

jobs:
  check:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  publish-sdk:
    name: Stage @ensc/sdk on npm
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: check
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted-publisher record. In a
    # public repository its protection rules (required reviewers, the `sdk-v*`
    # tag rule) are enforced.
    environment: npm-publish
    permissions:
      contents: read
      # OIDC: the npm CLI exchanges this job's identity token for a one-time
      # publish credential (trusted publishing). No npm token exists anywhere.
      # The same identity is what npm signs the provenance statement with.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # `npm stage` needs npm 11.15 or later and Node 22.14 or later.
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        run: |
          version="$(node -p "require('./packages/ensc-sdk/package.json').version")"
          if [ "sdk-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @ensc/sdk ${version}" >&2
            exit 1
          fi
      # The SDK and the two workspace packages it bundles.
      - run: pnpm --filter '@ensc/sdk...' build
      # `pnpm pack` resolves `workspace:*`; the npm CLI does the upload because
      # it performs the trusted-publishing token exchange.
      - run: pnpm --filter @ensc/sdk pack --pack-destination "$RUNNER_TEMP"
      # Staged, not published: the version goes live only when a maintainer
      # approves it on npmjs.com (or `npm stage approve <id>`) with 2FA.
      # `--provenance` makes the run fail rather than stage a version without a
      # provenance statement (it needs this repository to be public, and
      # `repository.url` in the package to match it exactly).
      - name: Stage @ensc/sdk
        run: npm stage publish "$RUNNER_TEMP"/ensc-sdk-*.tgz --access public --provenance
